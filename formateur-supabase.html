<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz - Formateur</title>
    <!-- Chargement direct du SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        
        .login-card h2 {
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
        }
        
        .app-container {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .app-container.show {
            display: block;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .content {
            padding: 30px;
        }
        
        .qcm-item {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .qcm-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .qcm-meta {
            font-size: 12px;
            color: #999;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 8px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-container">
    <div class="login-card">
        <h2>🔐 Formateur Login</h2>
        
        <div id="errorMsg" class="message error"></div>
        <div id="successMsg" class="message success"></div>
        
        <div id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="votre@email.com">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn" onclick="handleLogin()">Connexion</button>
            <div style="text-align: center; margin-top: 15px; font-size: 13px;">
                Pas encore inscrit ? <a onclick="showSignup()" style="color: #667eea; cursor: pointer; font-weight: 600;">S'inscrire</a>
            </div>
        </div>
        
        <div id="signupForm" style="display: none;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="votre@email.com">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="signupPassword" placeholder="••••••••">
            </div>
            <button class="btn" onclick="handleSignup()">Créer un compte</button>
            <div style="text-align: center; margin-top: 15px; font-size: 13px;">
                Déjà inscrit ? <a onclick="showLogin()" style="color: #667eea; cursor: pointer; font-weight: 600;">Se connecter</a>
            </div>
        </div>
    </div>
</div>

<!-- APP SCREEN -->
<div id="appScreen" class="app-container">
    <div class="header">
        <h1>📊 Tableau de Bord</h1>
        <button class="logout-btn" onclick="handleLogout()">Déconnexion</button>
    </div>
    
    <div class="content">
        <h2>📝 Vos QCM</h2>
        <button class="btn" style="margin-bottom: 20px; max-width: 200px;" onclick="alert('Fonctionnalité en développement')">+ Nouveau QCM</button>
        
        <div id="qcmList">
            <div class="loading">Chargement des QCM...</div>
        </div>
    </div>
</div>

<script>
// ==================== SUPABASE INIT ====================
const SUPABASE_URL = 'https://oojyvgxhgavaowmtvptb.supabase.co';
// ⚠️ Remplacez 'VOTRE_CLE_ANON_PUBLIC_SUPABASE' ci-dessous par la clé 'anon' 'public' récupérée dans Supabase
const SUPABASE_KEY = 'VOTRE_CLE_ANON_PUBLIC_SUPABASE';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==================== AUTH ====================
async function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    
    if (!email || !password) {
        showError('Email et mot de passe requis');
        return;
    }
    
    console.log('🔐 Tentative login:', email);
    
    try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });
        
        if (error) {
            console.error('❌ Erreur:', error.message);
            showError('Erreur: ' + error.message);
            return;
        }
        
        console.log('✅ Login réussi');
        showApp();
        
    } catch (error) {
        console.error('❌ Exception:', error);
        showError('Erreur: ' + error.message);
    }
}

async function handleSignup() {
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value.trim();
    
    if (!email || !password || password.length < 6) {
        showError('Email requis, mot de passe min 6 caractères');
        return;
    }
    
    console.log('📝 Tentative signup:', email);
    
    try {
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password
        });
        
        if (error) {
            console.error('❌ Erreur:', error.message);
            showError('Erreur: ' + error.message);
            return;
        }
        
        console.log('✅ Signup réussi');
        showSuccess('✅ Compte créé ! Vous pouvez maintenant vous connecter.');
        showLogin();
        
    } catch (error) {
        console.error('❌ Exception:', error);
        showError('Erreur: ' + error.message);
    }
}

async function handleLogout() {
    if (!supabaseClient) return;
    
    await supabaseClient.auth.signOut();
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appScreen').classList.remove('show');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
}

// ==================== UI ====================
function showError(message) {
    const el = document.getElementById('errorMsg');
    el.textContent = message;
    el.style.display = 'block';
    console.error('❌', message);
    setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function showSuccess(message) {
    const el = document.getElementById('successMsg');
    el.textContent = message;
    el.style.display = 'block';
    console.log('✅', message);
    setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('show');
    loadQCMs();
}

function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('signupForm').style.display = 'none';
}

function showSignup() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('signupForm').style.display = 'block';
}

async function loadQCMs() {
    console.log('📚 Chargement QCMs...');
    
    try {
        const { data, error } = await supabaseClient
            .from('qcms')
            .select('*')
            .order('dateCreation', { ascending: false });
        
        if (error) throw error;
        
        console.log('✅ QCMs:', data ? data.length : 0);
        
        const html = (data && data.length > 0) 
            ? data.map(qcm => `
                <div class="qcm-item">
                    <div class="qcm-title">${qcm.titre}</div>
                    <div class="qcm-meta">Entraînement: ${qcm.actifPourEntrainement ? '✅' : '❌'}</div>
                    <button class="btn btn-small" style="background: #6c757d;">✏️ Éditer</button>
                    <button class="btn btn-small" style="background: #dc3545;">🗑️ Supprimer</button>
                </div>
            `).join('')
            : '<p>Aucun QCM créé</p>';
        
        document.getElementById('qcmList').innerHTML = html;
        
    } catch (error) {
        console.error('❌ Erreur:', error);
        document.getElementById('qcmList').innerHTML = '<p style="color: red;">❌ ' + error.message + '</p>';
    }
}

// Vérification de la session active
window.addEventListener('load', async () => {
    try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            console.log('✅ Session trouvée');
            showApp();
        }
    } catch (e) {
        console.error('Erreur session:', e);
    }
});

console.log('📍 Page chargée.');
</script>

</body>
</html>
