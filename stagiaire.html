<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Stagiaire - Génie</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #121212; color: #ffffff; display: flex; justify-content: center; }
    .card { background: #1e1e1e; padding: 30px; border-radius: 16px; border: 2px solid #dc3545; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
    h1 { color: #dc3545; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
    input, button { padding: 14px; margin: 10px 0; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #444; font-size: 16px; background: #2b2b2b; color: #fff; }
    button { background: #dc3545; color: white; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    button:hover { background: #bd2130; }
    .screen { display: none; }
    .active { display: block; }
    .option-btn { background: #2b2b2b; color: #ffffff; border: 2px solid #444; display: none; }
    .option-btn:hover { background: #dc3545; border-color: #dc3545; }
    #timer-display { font-size: 24px; font-weight: bold; color: #dc3545; margin: 15px 0; }
    
    .home-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .home-tab-btn { flex: 1; padding: 10px; border: 1px solid #dc3545; background: #1e1e1e; color: #dc3545; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; text-transform: uppercase; }
    .home-tab-btn.active { background: #dc3545; color: white; }
    
    .qcm-training-list { list-style: none; padding: 0; margin-top: 15px; }
    .qcm-training-item { background: #2b2b2b; border: 1px solid #444; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: left; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #dc3545; }
    .qcm-training-item:hover { background: #3a3a3a; }
    
    .report-container { text-align: left; margin-top: 20px; padding: 15px; background: #2b2b2b; border-radius: 8px; max-height: 250px; overflow-y: auto; font-size: 14px; border: 1px solid #444; }
    .correct-ans { color: #28a745; font-weight: bold; }
    .wrong-ans { color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <!-- ÉCRAN 1 : ACCUEIL -->
    <div id="screen-home" class="screen active">
      <div class="home-tabs">
        <button class="home-tab-btn active" id="btn-tab-live">QCM Direct 🎮</button>
        <button class="home-tab-btn" id="btn-tab-train">Entraînement 📚</button>
      </div>

      <!-- Mode Live -->
      <div id="panel-live" class="active-panel">
        <h1 id="login-title">Rejoindre la Session</h1>
        <input type="text" id="sessionCodeInput" placeholder="Code de session">
        <input type="text" id="traineeNameInputLive" placeholder="Votre Prénom / Nom">
        <button id="joinLiveBtn">Se connecter au Direct</button>
      </div>

      <!-- Mode Entraînement -->
      <div id="panel-train" style="display:none;">
        <h1>Entraînement Libre</h1>
        <p>Entrez votre nom pour commencer :</p>
        <input type="text" id="traineeNameInputTrain" placeholder="Votre Prénom / Nom">
        <p style="font-size: 14px; color:#aaa; font-style:italic;">Choisissez l'un des QCM actuellement disponibles :</p>
        <ul id="trainingQcmList" class="qcm-training-list"></ul>
      </div>
    </div>

    <!-- ÉCRAN 2 : SALLE D'ATTAucune réponse
