<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mode Stagiaire</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; }
    
    .screen { display: none; }
    .screen.active { display: block; }
    
    .box { background: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 12px; border: 1px solid #333; }
    h1 { color: #dc3545; text-align: center; margin-bottom: 20px; font-size: 24px; }
    h2 { color: #17a2b8; margin-bottom: 15px; font-size: 18px; }
    
    input, select, button { padding: 12px; width: 100%; margin: 8px 0; border-radius: 8px; border: 1px solid #444; font-size: 16px; background: #2b2b2b; color: #fff; }
    button { background: #dc3545; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    button:hover { background: #bd2130; }
    
    .question-container { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; }
    .question-text { font-size: 20px; font-weight: bold; margin-bottom: 25px; line-height: 1.5; }
    
    .timer-display { background: #2b2b2b; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; border: 2px solid #17a2b8; }
    .timer-number { font-size: 48px; font-weight: bold; color: #17a2b8; font-family: monospace; }
    .timer-number.critical { color: #dc3545; animation: pulse 0.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    
    .options-container { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { padding: 15px; background: #2b2b2b; border: 2px solid #444; color: white; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; text-align: left; transition: 0.3s; }
    .option-btn:hover:not(:disabled) { border-color: #17a2b8; background: #333; }
    .option-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .wait-message { background: #ffc107; color: #212529; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; display: none; margin-top: 15px; }
    
    .mode-buttons { display: flex; gap: 12px; }
    .mode-buttons button { flex: 1; }
    .mode-buttons button.live { background: #dc3545; }
    .mode-buttons button.training { background: #17a2b8; }
    
    .results-box { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 2px solid #17a2b8; text-align: center; }
    .score-big { font-size: 48px; font-weight: bold; color: #28a745; margin: 20px 0; font-family: monospace; }
    .results-list { background: #2b2b2b; padding: 20px; border-radius: 8px; text-align: left; margin: 20px 0; max-height: 400px; overflow-y: auto; }
    .result-item { padding: 12px; margin: 8px 0; background: #1a1a1a; border-radius: 6px; border-left: 4px solid #444; }
    .result-item.correct { border-left-color: #28a745; }
    .result-item.wrong { border-left-color: #dc3545; }
    .result-status-correct { color: #28a745; }
    .result-status-wrong { color: #dc3545; }
  </style>
</head>
<body>

<div class="container">

  <!-- ÉCRAN SÉLECTION MODE -->
  <div id="screen-modeselection" class="screen active">
    <div class="box">
      <h1>🎯 Mode Stagiaire</h1>
      <p style="color: #888; text-align: center; margin-bottom: 20px;">Choisissez votre mode de jeu</p>
      <div class="mode-buttons">
        <button class="live" onclick="startLiveMode()">🔴 Mode Live</button>
        <button class="training" onclick="startTrainingMode()">🟦 Entraînement</button>
      </div>
    </div>
  </div>

  <!-- ÉCRAN REJOINDRE SESSION LIVE -->
  <div id="screen-join" class="screen">
    <div class="box">
      <h1>📱 Rejoindre une session</h1>
      <input type="text" id="sessionCode" placeholder="Entrez le code de session (ex: 1)">
      <input type="text" id="playerName" placeholder="Votre nom">
      <button onclick="joinSession()">Rejoindre</button>
      <button style="background: #6c757d; margin-top: 10px;" onclick="backToMode()">← Retour</button>
    </div>
  </div>

  <!-- ÉCRAN SÉLECTION QCM ENTRAÎNEMENT -->
  <div id="screen-trainingselect" class="screen">
    <div class="box">
      <h1>📚 Choisir un QCM</h1>
      <div id="qcmList"></div>
      <button style="background: #6c757d; margin-top: 15px;" onclick="backToMode()">← Retour</button>
    </div>
  </div>

  <!-- ÉCRAN JEU -->
  <div id="screen-game" class="screen">
    <div class="question-container">
      <div class="timer-display">
        <div class="timer-number" id="timerDisplay">00</div>
      </div>
      
      <div class="question-text" id="questionText"></div>
      <div class="options-container" id="optionsContainer"></div>
      <div class="wait-message" id="waitMessage">⏳ En attente de la prochaine question...</div>
    </div>
  </div>

  <!-- ÉCRAN RÉSULTATS -->
  <div id="screen-results" class="screen">
    <div class="results-box">
      <h1>🏆 Résultats</h1>
      <div class="score-big" id="finalScore">0/1000</div>
      <div class="results-list" id="resultsList"></div>
      <button onclick="backToMode()">← Retour au menu</button>
    </div>
  </div>

</div>

<script>
  // Vérifier si elle vient du QR code AVANT le chargement
  const urlParams = new URLSearchParams(window.location.search);
  window.sessionFromUrl = urlParams.get("session");
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, onSnapshot, getDoc, getDocs, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB5_JJfUZvEtgdvgC3RN655uNrHNQS4zJA",
    authDomain: "pse-b5bd5.firebaseapp.com",
    projectId: "pse-b5bd5",
    storageBucket: "pse-b5bd5.firebasestorage.app",
    messagingSenderId: "660081084756",
    appId: "1:660081084756:web:940b2d2a7ec939d2ac20c1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let isLiveMode = !!window.sessionFromUrl;
  let currentSessionId = "";
  let participantId = "";
  let currentQcmId = "";
  let currentQuestions = [];
  let currentQuestionIndex = 0;
  let reponses = {};
  let aRepondu = false;
  let intervalleMinuteur = null;
  let unsubscribeSession = null;
  let questionStartTime = null;

  // ===== MÉTRONOME SOUND =====
  function playMetronomeSound() {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.frequency.value = 800;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
    osc.start(audioContext.currentTime);
    osc.stop(audioContext.currentTime + 0.1);
  }

  // ===== ÉCRANS =====
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  window.backToMode = () => {
    if (unsubscribeSession) unsubscribeSession();
    currentSessionId = "";
    participantId = "";
    currentQcmId = "";
    reponses = {};
    currentQuestionIndex = 0;
    aRepondu = false;
    clearInterval(intervalleMinuteur);
    showScreen("screen-modeselection");
  };

  window.startLiveMode = () => {
    isLiveMode = true;
    showScreen("screen-join");
  };

  window.startTrainingMode = async () => {
    isLiveMode = false;
    await chargerQcmsEntrainement();
    showScreen("screen-trainingselect");
  };

  async function chargerQcmsEntrainement() {
    const list = document.getElementById("qcmList");
    list.innerHTML = "";

    try {
      const qcmsSnap = await getDocs(collection(db, "qcms"));
      const qcmsActifs = qcmsSnap.docs.filter(d => d.data().actifPourEntrainement);

      if (qcmsActifs.length === 0) {
        list.innerHTML = "<p style='color:#888;'>Aucun QCM disponible.</p>";
        return;
      }

      qcmsActifs.forEach(docSnap => {
        const qcm = docSnap.data();
        const btn = document.createElement("button");
        btn.style.background = "#17a2b8";
        btn.style.marginBottom = "8px";
        btn.innerText = qcm.titre;
        btn.onclick = () => startTraining(docSnap.id, qcm.titre);
        list.appendChild(btn);
      });
    } catch (e) {
      list.innerHTML = "<p style='color:#dc3545;'>Erreur: " + e.message + "</p>";
    }
  }

  async function startTraining(qcmId, title) {
    currentQcmId = qcmId;
    reponses = {};
    currentQuestionIndex = 0;
    aRepondu = false;

    try {
      const qSnap = await getDocs(collection(db, "qcms", qcmId, "questions"));
      currentQuestions = qSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      if (currentQuestions.length === 0) {
        alert("Aucune question dans ce QCM !");
        return;
      }

      showScreen("screen-game");
      afficherQuestion(currentQuestionIndex, null);
    } catch (e) {
      alert("Erreur: " + e.message);
    }
  }

  window.joinSession = async () => {
    const code = document.getElementById("sessionCode").value.trim().toUpperCase();
    const nom = document.getElementById("playerName").value.trim();

    if (!code || !nom) {
      alert("Veuillez remplir tous les champs !");
      return;
    }

    try {
      const sessionSnap = await getDoc(doc(db, "sessions", code));
      if (!sessionSnap.exists()) {
        alert("Session introuvable !");
        return;
      }

      currentSessionId = code;
      participantId = "participant_" + Date.now();

      await setDoc(doc(db, "sessions", currentSessionId, "participants", participantId), {
        nom: nom,
        score: 0,
        reponses: {},
        dateInscription: serverTimestamp()
      });

      showScreen("screen-game");
      reponses = {};
      ecouterSession();
    } catch (e) {
      alert("Erreur: " + e.message);
    }
  };

  function ecouterSession() {
    if (unsubscribeSession) unsubscribeSession();

    unsubscribeSession = onSnapshot(doc(db, "sessions", currentSessionId), async (docSnap) => {
      const session = docSnap.data();
      if (!session) return;

      if (session.statut === "en_cours") {
        const qcmId = session.qcmId;
        const questionIndex = session.questionActive;

        const qSnap = await getDocs(collection(db, "qcms", qcmId, "questions"));
        const questions = qSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        if (questionIndex < questions.length) {
          afficherQuestion(questionIndex, session.questionStartTime, questions);
        }
      } else if (session.statut === "terminee") {
        afficherResultats();
      }
    });
  }

  function afficherQuestion(index, questionStartTime, questions = null) {
    clearInterval(intervalleMinuteur);
    aRepondu = false;

    const q = questions ? questions[index] : currentQuestions[index];
    document.getElementById("questionText").innerText = q.question;
    document.getElementById("waitMessage").style.display = "none";

    const optionsContainer = document.getElementById("optionsContainer");
    optionsContainer.innerHTML = "";

    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = String.fromCharCode(65 + i) + ": " + opt;
      btn.onclick = () => validerReponse(String.fromCharCode(65 + i), q, index);
      optionsContainer.appendChild(btn);
    });

    // Calculer le temps restant
    if (questionStartTime) {
      questionStartTime = questionStartTime.seconds * 1000;
    }
    const now = Date.now();
    let tempsEcoule = isLiveMode && questionStartTime ? Math.floor((now - questionStartTime) / 1000) : 0;
    let tempsRestant = Math.max(0, q.tempsLimite - tempsEcoule);

    demarrerMinuteur(tempsRestant, q.tempsLimite, index, questions);
  }

  function demarrerMinuteur(tempsRestant, tempsTotal, index, questions) {
    let temps = tempsRestant;
    afficherTemps(temps);

    intervalleMinuteur = setInterval(() => {
      temps--;
      afficherTemps(temps);

      // MÉTRONOME À 5, 4, 3, 2, 1 SECONDES
      if (temps === 5 || temps === 4 || temps === 3 || temps === 2 || temps === 1) {
        playMetronomeSound();
      }

      if (temps <= 0) {
        clearInterval(intervalleMinuteur);
        if (!aRepondu) {
          aRepondu = true;
          document.getElementById("waitMessage").style.display = "block";
          document.querySelectorAll(".option-btn").forEach(btn => btn.disabled = true);

          // En entraînement, passer à la question suivante
          if (!isLiveMode) {
            setTimeout(() => {
              currentQuestionIndex++;
              if (currentQuestionIndex < currentQuestions.length) {
                afficherQuestion(currentQuestionIndex, null);
              } else {
                afficherResultats();
              }
            }, 1500);
          }
        }
      }
    }, 1000);
  }

  function afficherTemps(sec) {
    const display = document.getElementById("timerDisplay");
    display.innerText = String(sec).padStart(2, '0');

    if (sec <= 5) {
      display.classList.add("critical");
    } else {
      display.classList.remove("critical");
    }
  }

  async function validerReponse(choix, question, index) {
    if (aRepondu) return;
    aRepondu = true;

    clearInterval(intervalleMinuteur);
    document.querySelectorAll(".option-btn").forEach(btn => btn.disabled = true);
    document.getElementById("waitMessage").style.display = "block";

    // ===== NOTATION: UNIQUEMENT CORRECTNESS (PAS DE TEMPS) =====
    const estCorrect = question.reponsesCorrectes.includes(choix);
    const points = estCorrect ? 100 : 0;

    reponses[index] = {
      question: question.question,
      reponseChoisie: choix,
      reponseCorrecte: question.reponsesCorrectes.join(", "),
      correct: estCorrect,
      points: points
    };

    if (isLiveMode) {
      try {
        const totalScore = Object.values(reponses).reduce((s, r) => s + r.points, 0);
        await updateDoc(doc(db, "sessions", currentSessionId, "participants", participantId), {
          reponses: reponses,
          score: totalScore
        });
      } catch (e) {
        console.error(e);
      }
    } else {
      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
          afficherQuestion(currentQuestionIndex, null);
        } else {
          afficherResultats();
        }
      }, 1500);
    }
  }

  async function afficherResultats() {
    if (unsubscribeSession) unsubscribeSession();
    showScreen("screen-results");

    let data = {};
    if (isLiveMode) {
      const pSnap = await getDoc(doc(db, "sessions", currentSessionId, "participants", participantId));
      data = pSnap.data();
    } else {
      data = { reponses, score: Object.values(reponses).reduce((s, r) => s + r.points, 0) };
    }

    const score = data.score || 0;
    document.getElementById("finalScore").innerText = `${score}/1000`;

    const resultsList = document.getElementById("resultsList");
    resultsList.innerHTML = "";

    Object.keys(data.reponses || {}).forEach((index) => {
      const r = data.reponses[index];
      const div = document.createElement("div");
      div.className = `result-item ${r.correct ? 'correct' : 'wrong'}`;

      const statusClass = r.correct ? "result-status-correct" : "result-status-wrong";
      const statusText = r.correct ? "✅ Correct" : "❌ Faux";

      div.innerHTML = `
        <strong>Q${parseInt(index) + 1}: ${r.question}</strong><br>
        Votre réponse: <strong>${r.reponseChoisie}</strong> | Correcte(s): <strong>${r.reponseCorrecte}</strong><br>
        <span class="${statusClass}">${statusText}</span>
      `;
      resultsList.appendChild(div);
    });
  }

  // ===== INITIALISER AVEC LE QR CODE SI PRÉSENT =====
  if (window.sessionFromUrl) {
    setTimeout(() => {
      document.getElementById("sessionCode").value = window.sessionFromUrl;
      showScreen("screen-join");
    }, 100);
  }

</script>

</body>
</html>
